[package]
name = "screenyield"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Menu bar app for macOS that switches external monitors off and on, so another computer can have them"
repository = "https://github.com/eckonator/ScreenYield"
publish = false

[dependencies]
tray-icon = "0.26"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
core-foundation-sys = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
